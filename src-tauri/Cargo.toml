[package]
name = "al-navi"
version = "1.14.8"
description = "Al-Navi — modern dual-panel file manager"
edition = "2021"

[lib]
name = "al_navi_lib"
crate-type = ["rlib"]

[features]
# production build: serve the frontend from the assets embedded in the exe
# (without it the window loads the devUrl — vite dev server — instead).
# `npm run release` passes --features custom-protocol, mirroring `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
notify = "8"
notify-debouncer-full = "0.5"
encoding_rs = "0.8"
walkdir = "2"
trash = "5"
dirs = "6"
sysinfo = "0.37"
filetime = "0.2"
suppaftp = { version = "12", default-features = false, features = ["tokio"] }
# V2: SFTP client. russh + russh-sftp are pure Rust (no ring/openssl/C
# build), keeping the offline cargo-cache build working on the MSYS2 GNU
# toolchain; fetched once into the local cargo cache like zip/tar before
russh = "0.46"
russh-sftp = "2.4"
async-trait = "0.1"
# 1.13.1 is already in Cargo.lock as a transitive dep, so this resolves
# from the local cargo cache without network access
regex = "1.13.1"
# M6 archives: zip/tar/tar.gz/7z read+write (flate2 was already in the lock
# as a transitive dep; zip/tar/sevenz-rust were fetched once and now stay
# in the local cargo cache for offline builds)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6"
# alnavi-039: in-app updates from the Aila center. reqwest was already in the
# lock (0.13.x, no TLS); native-tls resolves to schannel on Windows — pure
# Rust over the OS TLS, no openssl/C build on the GNU toolchain. sha2 and
# futures-util were in the lock as transitive deps too.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
