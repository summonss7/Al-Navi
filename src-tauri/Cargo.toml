[package]
name = "al-navi"
version = "1.0.1"
description = "Al-Navi — modern dual-panel file manager"
edition = "2021"

[lib]
name = "al_navi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
notify = "8"
notify-debouncer-full = "0.5"
encoding_rs = "0.8"
walkdir = "2"
trash = "5"
dirs = "6"
sysinfo = "0.37"
filetime = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
